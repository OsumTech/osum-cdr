limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
    listen 80;
    server_name cdr.osumtech.net;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://cdr.osumtech.net$request_uri; }
}
server {
    listen 443 ssl;
    server_name cdr.osumtech.net;
    ssl_certificate /etc/letsencrypt/live/cdr.osumtech.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdr.osumtech.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location ^~ /webhooks/didlogic/ {
        # The URL contains a bearer secret; do not write it to request/error logs.
        access_log off;
        error_log /dev/null;
        client_max_body_size 64k;
        proxy_pass http://web:8000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location = /login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location / {
        proxy_pass http://web:8000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
