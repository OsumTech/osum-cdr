{% if pagination.pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if pagination.has_prev %}<a class="button" href="{{ url_for(request.endpoint, page=pagination.prev_num, destination=query or '', start=request.args.get('start', ''), end=request.args.get('end', '')) }}">Previous</a>{% endif %}<span>Page {{ pagination.page }} of {{ pagination.pages }}</span>{% if pagination.has_next %}<a class="button" href="{{ url_for(request.endpoint, page=pagination.next_num, destination=query or '', start=request.args.get('start', ''), end=request.args.get('end', '')) }}">Next</a>{% endif %}</nav>{% endif %}
